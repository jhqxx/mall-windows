name: build

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: mac-arm64
          - os: windows-latest
            artifact: win-x64

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Compile renderer and main
        run: pnpm build

      - name: Package macOS dmg
        if: runner.os == 'macOS'
        shell: bash
        run: pnpm exec electron-builder --mac --arm64 --publish never > package.log 2>&1

      - name: Package Windows exe
        if: runner.os == 'Windows'
        shell: bash
        run: pnpm exec electron-builder --win --x64 --publish never > package.log 2>&1

      - name: Package log
        if: always()
        shell: bash
        run: |
          if [ -f package.log ]; then
            {
              echo '## 打包日志（末 150 行）'
              echo ''
              echo '```'
              tail -n 150 package.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Collect macOS artifacts
        if: runner.os == 'macOS' && success()
        uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: |
            release/*.dmg
            release/*.dmg.blockmap
          if-no-files-found: error

      - name: Collect Windows artifacts
        if: runner.os == 'Windows' && success()
        uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: |
            release/*.exe
            release/*.exe.blockmap
          if-no-files-found: error

  release:
    name: release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.dmg
            dist/**/*.exe
          generate_release_notes: true
